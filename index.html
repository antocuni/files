        <script>
            document.addEventListener('DOMContentLoaded', function() {
                const readmeContent = document.getElementById('readme-content');
                if (readmeContent) {
                    // Configure marked for GitHub-flavored markdown
                    marked.setOptions({
                        gfm: true,
                        breaks: true,
                        headerIds: true,

                                try {

                                } catch(e) {}
                            }
                            return code;
                        }
                    });

                    // Render the markdown
                    readmeContent.innerHTML = marked.parse(`# antocuni's misc files\n\nThe directory listing are generated by running:\n\`\`\`\n$ python genindex.py\n\`\`\`\n\n\`genindex.py\` has been written by Claude 3.7 sonnet.\n\n## Links:\n\n- github pages link: https://antocuni.github.io/files/\n- jsdelivr CDN link: https://cdn.jsdelivr.net/gh/antocuni/files/\n\n## Link examples:\n\n- https://cdn.jsdelivr.net/gh/antocuni/files/pyscript/snapshots/main/2023-05-10-b247864/pyscript.min.js\n- https://antocuni.github.io/files/pyscript/snapshots/main/2023-05-10-b247864/pyscript.min.js\n- https://antocuni.github.io/files/pyodide/0.22.0.dev0/zipimport2/console.html\n- https://cdn.jsdelivr.net/gh/antocuni/files/pyscript/snapshots/next/2023-06-08-fd1cd5b/pyscript.core/esm/index.js\n`);
